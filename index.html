                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-3">
                    <div>
                      <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                        <span>🩻</span>
                        <span>Radiology & X-Ray Reports</span>
                      </h3>
                      <p className="text-xs text-slate-500">Imaging studies, radiologist impression, and PACS preview</p>
                    </div>
                    <div className="flex items-center gap-2 self-start sm:self-auto flex-wrap">
                      <button
                        type="button"
                        onClick={() => { setUploadCategory("xray"); setShowUploadModal(true); }}
                        className="px-3 py-2 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 font-bold text-xs flex items-center gap-1.5 transition-colors cursor-pointer"
                      >
                        <span>➕ Upload X-Ray (PNG/PDF)</span>
                      </button>
                      {rad && (
                        <button
                          type="button"
                          onClick={downloadXRayPdf}
                          className="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs shadow-sm flex items-center gap-1.5 transition-colors cursor-pointer"
                        >
                          <span>⬇️ Download X-Ray Report (PDF)</span>
                        </button>
                      )}
                    </div>

                            <span className="text-[10px] font-bold uppercase text-slate-400 block">Study Name</span>
                            <span className="font-bold text-slate-900">{rad.studyName || rad.investigation}</span>
                          </div>
                          <div>
                            <span className="text-[10px] font-bold uppercase text-slate-400 block">Study Date</span>
                            <span className="font-semibold text-slate-800">{rad.date}</span>
                          </div>
                          <div>
                            <span className="text-[10px] font-bold uppercase text-slate-400 block">Radiologist</span>
                            <span className="font-semibold text-slate-800">{rad.radiologist || "Attending Radiologist"}</span>
                          </div>
                        </div>

                        <div className="p-3.5 rounded-xl bg-amber-50/70 border border-amber-200">
                          <span className="text-[10px] font-bold uppercase tracking-wider text-amber-800 block mb-1">Radiologist Impression</span>
                          <p className="text-sm font-bold text-slate-900 leading-snug">{rad.impression}</p>
                        </div>

                        <div className="p-3 rounded-xl bg-white border border-slate-200 space-y-1.5">

                            <span className="font-bold text-slate-700">Findings: </span>
                            <span className="text-slate-700">{rad.findings}</span>

                            No PACS thumbnail attached

                      </div>
                    </div>

                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-500 text-center">
                      No reports on file
                    </div>
                  )}
                </div>

                {/* 2. BLOOD & LABORATORY CARD */}

                    <div>
                      <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                        <span>🩸</span>
                        <span>Blood & Laboratory Reports</span>
                      </h3>
                      <p className="text-xs text-slate-500">CBC, Coagulation & Chemistry with pre-op vs post-op comparison</p>
                    </div>
                    <div className="flex items-center gap-2 self-start sm:self-auto flex-wrap">
                      <button
                        type="button"
                        onClick={() => { setUploadCategory("blood"); setShowUploadModal(true); }}
                        className="px-3 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold text-xs flex items-center gap-1.5 transition-colors cursor-pointer"
                      >
                        <span>➕ Upload Blood Report (PNG/PDF)</span>
                      </button>
                      {(lab || trt?.postopCBC) && (
                        <button

                          onClick={downloadBloodPdf}
                          className="px-3.5 py-2 rounded-xl bg-rose-700 hover:bg-rose-800 text-white font-bold text-xs shadow-sm flex items-center gap-1.5 transition-colors cursor-pointer"
                        >
                          <span>⬇️ Download Blood Report (PDF)</span>
                        </button>
                      )}
                    </div>
                  </div>

                  {(lab || trt?.postopCBC) ? (
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 text-xs">
                      {/* Pre-Op / Initial */}
                      <div className="border border-slate-200 rounded-xl p-3.5 space-y-3 bg-white">
                        <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                          <span className="font-bold text-slate-900">Pre-Op / Initial Panel</span>
                          <span className="font-mono text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded">{lab?.dateTime || post?.encounterDates || "Admission"}</span>
                        </div>
                        {lab?.cbc?.length > 0 && (
                          <div>
                            <div className="text-[10px] font-bold uppercase text-slate-500 mb-1">Complete Blood Count (CBC)</div>
                            <table className="w-full text-left text-[11px]">
                              <thead className="text-[9px] uppercase text-slate-400 border-b border-slate-200">
                                <tr><th className="py-1 px-2">Parameter</th><th className="py-1 px-2">Value</th><th className="py-1 px-2">Ref Range</th><th className="py-1 px-2 text-right">Status</th></tr>
                              </thead>
                              <tbody>{lab.cbc.map(renderLabRow)}</tbody>
                            </table>
                          </div>
                        )}
                        {lab?.coagulation?.length > 0 && (
                          <div>
                            <div className="text-[10px] font-bold uppercase text-slate-500 mb-1">Coagulation</div>
                            <table className="w-full text-left text-[11px]"><tbody>{lab.coagulation.map(renderLabRow)}</tbody></table>
                          </div>
                        )}
                        {lab?.chemistry?.length > 0 && (
                          <div>
                            <div className="text-[10px] font-bold uppercase text-slate-500 mb-1">Chemistry & Electrolytes</div>
                            <table className="w-full text-left text-[11px]"><tbody>{lab.chemistry.map(renderLabRow)}</tbody></table>
                          </div>
                        )}
                      </div>

                      {/* Post-Op */}
                      <div className="border border-slate-200 rounded-xl p-3.5 space-y-3 bg-white">
                        <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                          <span className="font-bold text-slate-900">Post-Op / Recovery Panel</span>
                          <span className="font-mono text-[10px] bg-blue-50 text-blue-700 px-2 py-0.5 rounded">{trt?.postopDateTime || "Post-Op"}</span>
                        </div>
                        {trt?.postopCBC?.length > 0 ? (
                          <>
                            <div>
                              <div className="text-[10px] font-bold uppercase text-slate-500 mb-1">Post-Op CBC</div>
                              <table className="w-full text-left text-[11px]">
                                <thead className="text-[9px] uppercase text-slate-400 border-b border-slate-200">
                                  <tr><th className="py-1 px-2">Parameter</th><th className="py-1 px-2">Value</th><th className="py-1 px-2">Ref Range</th><th className="py-1 px-2 text-right">Status</th></tr>
                                </thead>
                                <tbody>{trt.postopCBC.map(renderLabRow)}</tbody>

                    required
                    value={formData.bloodGroup}
                    onChange={(e) => setFormData({ ...formData, bloodGroup: e.target.value })}
                    className="w-full px-3 py-2 border rounded-xl"
                  />
                </div>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Primary Clinical Condition</label>
                <input
                  type="text"
                  required
                  value={formData.primaryCondition}
                  onChange={(e) => setFormData({ ...formData, primaryCondition: e.target.value })}
                  className="w-full px-3 py-2 border rounded-xl"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Historical Medical Diagnoses</label>
                <textarea
                  rows="3"
                  value={formData.previousDiagnoses}
                  onChange={(e) => setFormData({ ...formData, previousDiagnoses: e.target.value })}
                  className="w-full px-3 py-2 border rounded-xl"
                />
              </div>

              <div className="pt-2 flex justify-end space-x-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 border rounded-xl text-slate-600 font-semibold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold shadow"
                >
                  Save & Log Alteration
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // 8. EMERGENCY RFID BYPASS WARNING MODAL (EMT & DOCTORS)
    // ==========================================
    function EmergencyRfidWarningModal({ bypassData, user, onConfirm, onFallbackToPin, onCancel }) {
      const { targetId, cardUID, targetRecord } = bypassData;
      const [justification, setJustification] = useState("Acute emergency resuscitation / Unresponsive trauma intake");

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm screen-fade">
          <div className="bg-white rounded-2xl p-6 sm:p-8 max-w-lg w-full border-2 border-rose-300 shadow-2xl space-y-4">
            <div className="flex items-start space-x-3 pb-3 border-b border-rose-100">
              <div className="w-12 h-12 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center text-2xl font-bold flex-shrink-0">
                🚨
              </div>
              <div>
                <h3 className="text-lg font-bold text-rose-950">Emergency RFID Direct Bypass</h3>
                <p className="text-xs text-rose-800 font-medium">Authorized Clinical Personnel: {user?.role} ({user?.name})</p>
              </div>
            </div>

            <div className="p-3.5 bg-rose-50 rounded-xl border border-rose-200 text-xs text-rose-900 space-y-1.5">
              <p className="font-bold">⚠️ STATUTORY CLINICAL WARNING & AUDIT NOTICE:</p>
              <p className="leading-relaxed">
                You are about to bypass the patient consent OTP/PIN using physical RFID Card <strong className="font-mono">{cardUID}</strong> to access <strong className="font-semibold">{targetRecord.name} ({targetId})</strong>.
              </p>
              <p className="text-[11px] text-rose-700 font-semibold pt-1">
                This emergency access will be permanently logged with your name, timestamp, and IP in the compliance audit trail.
              </p>
            </div>

            <div className="space-y-1.5 text-xs">
              <label className="block font-semibold text-slate-700">Clinical Emergency Justification:</label>
              <select
                value={justification}
                onChange={(e) => setJustification(e.target.value)}
                className="w-full px-3 py-2 border border-slate-300 rounded-xl bg-slate-50 font-medium text-slate-800"
              >
                <option value="Acute emergency resuscitation / Unresponsive trauma intake">Acute emergency resuscitation / Unresponsive trauma intake</option>
                <option value="Hypovolemic shock / Immediate cross-match & surgical fixation">Hypovolemic shock / Immediate cross-match & surgical fixation</option>
                <option value="Cardiac arrest / Code Blue vital medical history retrieval">Cardiac arrest / Code Blue vital medical history retrieval</option>
                <option value="Severe altered mental status / Critical allergy check">Severe altered mental status / Critical allergy check</option>
              </select>
            </div>

            <div className="pt-2 flex flex-col sm:flex-row items-center justify-end gap-2 text-xs">
              <button
                type="button"
                onClick={onFallbackToPin}
                className="w-full sm:w-auto px-3.5 py-2 border border-slate-200 rounded-xl text-slate-600 hover:bg-slate-50 font-semibold"
              >
                Enter Standard PIN Instead
              </button>
              <button
                type="button"
                onClick={() => onConfirm(justification)}
                className="w-full sm:w-auto px-4 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center gap-1.5"
              >
                <span>Acknowledge Warning & Open EMR &rarr;</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 9. ADMIN & RECEPTIONIST: ADD ROOM & BED MODAL
    // ==========================================
    function AddRoomBedModal({ onClose, onAddRoom }) {
      const [roomData, setRoomData] = useState({
        room: "GEN-303",
        ward: "General Medicine",
        bed: "BED-A",
        status: "Available",
        patient: "—",
        id: "—"
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        onAddRoom(roomData);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm screen-fade">
          <div className="bg-white rounded-2xl p-6 sm:p-8 max-w-md w-full border border-slate-200 shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b pb-3">
              <div>
                <h3 className="text-lg font-bold text-slate-900">Add New Hospital Room & Bed</h3>
                <p className="text-xs text-slate-500">Authorized: Administration & Reception Personnel</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Room Identifier</label>
                <input
                  type="text"
                  required
                  value={roomData.room}
                  onChange={(e) => setRoomData({ ...roomData, room: e.target.value })}
                  placeholder="e.g. ICU-04, GEN-303"
                  className="w-full px-3 py-2 border rounded-xl"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Ward Name</label>
                <select
                  value={roomData.ward}
                  onChange={(e) => setRoomData({ ...roomData, ward: e.target.value })}
                  className="w-full px-3 py-2 border rounded-xl bg-slate-50"
                >
                  <option value="General Medicine">General Medicine</option>
                  <option value="Intensive Care Unit">Intensive Care Unit</option>
                  <option value="Orthopedic Surgery">Orthopedic Surgery</option>
                  <option value="Cardiology Unit">Cardiology Unit</option>
                  <option value="Emergency Trauma Ward">Emergency Trauma Ward</option>
                  <option value="Pediatrics">Pediatrics</option>
                </select>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Bed Identifier</label>
                <input
                  type="text"
                  required
                  value={roomData.bed}
                  onChange={(e) => setRoomData({ ...roomData, bed: e.target.value })}
                  placeholder="e.g. BED-A, BED-1"
                  className="w-full px-3 py-2 border rounded-xl"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Initial Status</label>
                <select
                  value={roomData.status}
                  onChange={(e) => setRoomData({ ...roomData, status: e.target.value, patient: e.target.value === 'Available' ? '—' : roomData.patient })}
                  className="w-full px-3 py-2 border rounded-xl bg-slate-50"
                >
                  <option value="Available">Available (Unoccupied)</option>
                  <option value="Occupied">Occupied</option>
                </select>
              </div>

              {roomData.status === "Occupied" && (
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Initial Patient Name</label>
                  <input
                    type="text"
                    required
                    value={roomData.patient === "—" ? "" : roomData.patient}
                    onChange={(e) => setRoomData({ ...roomData, patient: e.target.value })}
                    placeholder="Enter patient name"
                    className="w-full px-3 py-2 border rounded-xl"
                  />
                </div>
              )}

              <div className="pt-2 flex justify-end space-x-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 border rounded-xl text-slate-600 font-semibold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold shadow"
                >
                  Add Room Allocation
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // 10. ADMIN ONLY: ADD DOCTOR & ASSIGN DEPARTMENT MODAL
    // ==========================================
    function AddDoctorModal({ departments, onClose, onAddDoctor }) {
      const [doctorData, setDoctorData] = useState({
        username: "doctor_new",
        password: "123",
        role: "Doctor",
        name: "Dr. ",
        dept: departments[0]?.name || "Orthopedics & Trauma Surgery"
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        onAddDoctor(doctorData);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm screen-fade">
          <div className="bg-white rounded-2xl p-6 sm:p-8 max-w-md w-full border border-purple-200 shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b border-purple-100 pb-3">
              <div>
                <h3 className="text-lg font-bold text-slate-900">Add Doctor & Assign Department</h3>
                <p className="text-xs text-purple-700 font-semibold">Strictly Admin Privileges Only</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Doctor Full Name & Title</label>
                <input
                  type="text"
                  required
                  value={doctorData.name}
                  onChange={(e) => setDoctorData({ ...doctorData, name: e.target.value })}
                  placeholder="e.g. Dr. Meredith Grey, MD"
                  className="w-full px-3 py-2 border rounded-xl"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Assign Clinical Department</label>
                <select
                  value={doctorData.dept}
                  onChange={(e) => setDoctorData({ ...doctorData, dept: e.target.value })}
                  className="w-full px-3 py-2 border rounded-xl bg-purple-50/50 text-slate-800 font-medium"
                >
                  {departments.map((d, i) => (
                    <option key={i} value={d.name}>{d.name} (Head: {d.head})</option>
                  ))}
                </select>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Login Username</label>
                  <input
                    type="text"
                    required
                    value={doctorData.username}
                    onChange={(e) => setDoctorData({ ...doctorData, username: e.target.value.toLowerCase().trim() })}
                    placeholder="doctor_name"
                    className="w-full px-3 py-2 border rounded-xl font-mono"
                  />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Initial Password</label>
                  <input
                    type="password"
                    required
                    value={doctorData.password}
                    onChange={(e) => setDoctorData({ ...doctorData, password: e.target.value })}
                    className="w-full px-3 py-2 border rounded-xl font-mono"
                  />
                </div>
              </div>

              <div className="pt-2 flex justify-end space-x-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 border rounded-xl text-slate-600 font-semibold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-semibold shadow"
                >
                  Assign Doctor & Save
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Mount App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
