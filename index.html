<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseCare HMS - Hospital Management & Clinical Records Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 and ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- jsPDF for Direct 1-Page Text PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              200: '#bae0fd',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              800: '#0c4a6e',
              900: '#082f49'
            },
            clinical: {
              navy: '#0f172a',
              slate: '#1e293b',
              accent: '#2563eb',
              teal: '#0d9488'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05), 0 1px 2px -1px rgb(0 0 0 / 0.05);
    }
    .badge-pulse {
      animation: pulse-light 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-light {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    .screen-fade {
      animation: fadeIn 0.2s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm;
      }
      body.printing-one-page * {
        visibility: hidden !important;
      }
      body.printing-one-page #one-page-report-sheet,
      body.printing-one-page #one-page-report-sheet * {
        visibility: visible !important;
      }
      body.printing-one-page #one-page-report-sheet {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col">
  <div id="root" class="flex flex-col flex-1"></div>

  <!-- Externalized Hospital Datasets from /data folder -->
  <script src="data/hms_data.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==========================================
    // INITIAL CLINICAL & HOSPITAL DATASET
    // ==========================================
        // Auto-load structured datasets from window.PULSECARE_DATA (/data folder)
    const _pData = window.PULSECARE_DATA || {};
    const INITIAL_PATIENT_RECORDS = _pData.INITIAL_PATIENT_RECORDS || {};
    const INITIAL_AUDIT_LOGS = _pData.INITIAL_AUDIT_LOGS || [];
    const MOCK_DATA = _pData.MOCK_DATA || { auth: { users: [] }, stats: {}, rooms: [], departments: [], appointments: [] };

    // ==========================================
    // ROOT APPLICATION COMPONENT
    // ==========================================
    function App() {
      // Application State
      const [view, setView] = useState("main"); // 'main' | 'login' | 'dashboard' | 'patient-lookup' | 'consent' | 'patient-record'
      const [user, setUser] = useState(null); // { username, role, name, isEmergencyAccess? }
      const [selectedRole, setSelectedRole] = useState("Doctor");
      const [sidebarTab, setSidebarTab] = useState("overview"); // 'overview' | 'patients' | 'records' | 'rooms' | 'departments' | 'appointments' | 'emergency' | 'staff' | 'logs' | 'settings'

      // Dynamic Patient Records (Allows Admin Delete & Edit)
      const [patientRecords, setPatientRecords] = useState(INITIAL_PATIENT_RECORDS);

      // Dynamic Rooms & Beds (Admins & Receptionists can add/allocate beds & rooms)
      const [rooms, setRooms] = useState(MOCK_DATA.rooms);

      // Dynamic Clinical Departments (Admins can add doctors & assign head/doctors)
      const [departments, setDepartments] = useState(MOCK_DATA.departments);

      // Dynamic Staff / Doctors List (Admins can add new doctors & staff)
      const [staffUsers, setStaffUsers] = useState(MOCK_DATA.auth.users);

      // Access & Audit Log System
      const [auditLogs, setAuditLogs] = useState(INITIAL_AUDIT_LOGS);

      // Modals for Adding Rooms/Beds and Doctors
      const [showAddRoomModal, setShowAddRoomModal] = useState(false);
      const [showAddDoctorModal, setShowAddDoctorModal] = useState(false);

      // Patient Record Flow State
      const [patientIdInput, setPatientIdInput] = useState("");
      const [selectedPatientId, setSelectedPatientId] = useState(null);
      const [pinInput, setPinInput] = useState("");
      const [isPinVerified, setIsPinVerified] = useState(false);

      // Inline Errors & Notifications
      const [loginError, setLoginError] = useState("");
      const [lookupError, setLookupError] = useState("");
      const [consentError, setConsentError] = useState("");
      const [notification, setNotification] = useState(null);

      // Admin Modal State for Editing Patient
      const [editingPatient, setEditingPatient] = useState(null);

      // Live ESP32 RFID USB Hardware State
      const [esp32Status, setEsp32Status] = useState({ connected: false, port: null });
      const [lastCardScan, setLastCardScan] = useState(null);
      const [isScanningAnimation, setIsScanningAnimation] = useState(false);

      // Helper: Show temporary toast banner
      const showToast = (message, type = "success") => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 4000);
      };

      // Helper: Add Audit Log Entry
      const logAccess = (action, details, actingUser = user) => {
        const now = new Date();
        const timestamp = now.toISOString().replace('T', ' ').substring(0, 19);
        const newEntry = {
          id: Date.now(),
          timestamp,
          user: actingUser ? actingUser.name : "Unauthenticated / System",
          role: actingUser ? actingUser.role : "Unknown",
          action,
          details
        };
        setAuditLogs(prev => [newEntry, ...prev]);
      };

      // WebSocket Connection for ESP32 USB Bridge
      useEffect(() => {
        let ws;
        function connectWS() {
          try {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onmessage = (event) => {
              try {
                const data = JSON.parse(event.data);
                if (data.type === 'STATUS') {
                  setEsp32Status({ connected: data.connected, port: data.port });
                } else if (data.type === 'RFID_SCAN') {
                  handleHardwareScan(data.patientId, data.uid);
                }
              } catch (e) {}
            };

            ws.onclose = () => {
              setEsp32Status({ connected: false, port: null });
              setTimeout(connectWS, 3000);
            };
          } catch (e) {}
        }
        connectWS();
        return () => { if (ws) ws.close(); };
      }, [user, view, patientRecords]);

      // State for Emergency RFID Bypass Warning Confirmation Modal
      const [pendingRfidBypass, setPendingRfidBypass] = useState(null); // { targetId, cardUID, targetRecord }

      // Hardware RFID Scan Dispatcher
      const handleHardwareScan = (scannedPatientId, cardUID) => {
        setLastCardScan({ uid: cardUID, time: new Date().toLocaleTimeString() });
        setIsScanningAnimation(true);
        setTimeout(() => setIsScanningAnimation(false), 800);

        const targetId = (scannedPatientId && scannedPatientId !== "P001") ? scannedPatientId : "PAT-2026-001";
        setPatientIdInput(targetId);

        let targetRecord = patientRecords[targetId] || patientRecords["PAT-2026-001"];

        if (targetRecord) {
          const userRole = user?.role;
          // If logged in as EMT or Doctor, trigger Emergency RFID Direct Bypass Modal with Warning & Audit Trail
          if (userRole === "EMT" || userRole === "Doctor") {
            setPendingRfidBypass({ targetId: targetRecord.id, cardUID, targetRecord });
          } else {
            // Receptionist, Admin, or non-clinical roles proceed to standard PIN consent gate
            setSelectedPatientId(targetRecord.id);
            setIsPinVerified(false);
            setPinInput("");
            setLookupError("");
            setConsentError("");

            logAccess(
              "RFID_CARD_SCANNED",
              `RC522 RFID Card [UID: ${cardUID}] scanned for patient ${targetRecord.id} (${targetRecord.name}). Proceeding to Consent Verification Gate.`
            );
            showToast(`💳 RFID Card Detected: Enter Consent PIN for ${targetRecord.name}`, "success");
            setView("consent");
          }
        }
      };

      // Confirm Emergency RFID Bypass (EMT & Doctors only)
      const confirmEmergencyRfidBypass = (reason = "Acute trauma resuscitation / Unconscious patient") => {
        if (!pendingRfidBypass) return;

        const { targetId, cardUID, targetRecord } = pendingRfidBypass;
        setSelectedPatientId(targetId);
        setIsPinVerified(true);
        setLookupError("");
        setConsentError("");

        logAccess(
          "EMERGENCY_RFID_OTP_BYPASS",
          `🚨 CRITICAL CLINICAL BYPASS: ${user?.role} ${user?.name} bypassed patient consent OTP using physical RFID Card [UID: ${cardUID}] for ${targetId} (${targetRecord.name}). Justification: ${reason}. Full EMR released.`
        );

        showToast(`⚠️ Emergency RFID Bypass Authorized: Accessing ${targetRecord.name} EMR (Audit Logged)`, "warning");
        setPendingRfidBypass(null);
        setView("patient-record");
      };

      // Handle Standard Login (Standard authentication required for staff)
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const username = e.target.username.value.trim();
        const password = e.target.password.value.trim();

        if (!selectedRole) {
          setLoginError("Please select a professional role.");
          return;
        }

        const validUser = MOCK_DATA.auth.users.find(
          u => u.username.toLowerCase() === username.toLowerCase() && u.password === password
        );

        if (validUser) {
          const authUser = {
            username: validUser.username,
            name: validUser.name,
            role: selectedRole
          };
          setUser(authUser);
          setLoginError("");
          logAccess("STAFF_LOGIN", `Standard password login as ${selectedRole}`, authUser);
          setView("dashboard");
          setSidebarTab("overview");
        } else {
          setLoginError("Invalid username or password. (Demo: doctor_smith / 123, admin / 123)");
        }
      };

      // Patient Lookup Submit -> Advances to Mandatory Consent Verification Gate
      const handleLookupSubmit = (e) => {
        if (e) e.preventDefault();
        const cleanedId = patientIdInput.trim().toUpperCase();

        if (!cleanedId) {
          setLookupError("Please enter or scan a valid Patient Identifier.");
          return;
        }

        let targetRecord = patientRecords[cleanedId];
        if (!targetRecord && cleanedId === "P001") {
          targetRecord = patientRecords["PAT-2026-001"];
        }

        if (targetRecord) {
          setLookupError("");
          setSelectedPatientId(targetRecord.id);
          setIsPinVerified(false);
          setPinInput("");
          setConsentError("");

          logAccess(
            "PATIENT_ID_LOOKUP",
            `Patient ID lookup verified [${targetRecord.id} - ${targetRecord.name}]. Consent PIN verification required.`
          );
          setView("consent");
        } else {
          setLookupError(`No matching medical record found for Patient ID "${cleanedId}".`);
          logAccess("PATIENT_LOOKUP_NOT_FOUND", `Failed lookup attempt for ID "${cleanedId}"`);
        }
      };

      // Mandatory Patient Consent PIN Verification (No bypass)
      const handleConsentSubmit = (e) => {
        if (e) e.preventDefault();
        if (pinInput.trim() === MOCK_DATA.consentPin) {
          setConsentError("");
          setIsPinVerified(true);
          logAccess(
            "PATIENT_CONSENT_VERIFIED",
            `Patient consent 4-digit PIN verified successfully for ${selectedPatientId} by ${user?.name || 'Staff'}. EMR record opened.`
          );
          setView("patient-record");
        } else {
          setConsentError("Incorrect PIN, try again.");
          logAccess("PATIENT_CONSENT_FAILED", `Incorrect PIN entered for ${selectedPatientId} by ${user?.name || 'Staff'}`);
          setPinInput("");
        }
      };

      // ADMIN: Delete Patient Record
      const handleDeletePatient = (patientId) => {
        if (user?.role !== "Admin") {
          alert("Unauthorized: Only Administrators can delete patient records.");
          return;
        }

        const patientToDelete = patientRecords[patientId];
        if (!patientToDelete) return;

        const confirmDelete = window.confirm(
          `Are you sure you want to permanently delete record ${patientId} (${patientToDelete.name})?\nThis action will be logged in the permanent audit trail.`
        );

        if (confirmDelete) {
          setPatientRecords(prev => {
            const updated = { ...prev };
            delete updated[patientId];
            return updated;
          });

          logAccess(
            "PATIENT_RECORD_DELETED",
            `Administrator ${user.name} permanently deleted medical record for ${patientId} (${patientToDelete.name})`
          );
          showToast(`Record ${patientId} successfully deleted.`, "success");

          if (selectedPatientId === patientId) {
            setView("dashboard");
            setSelectedPatientId(null);
          }
        }
      };

      // ADMIN: Save Altered Patient Record
      const handleSaveEditedPatient = (updatedRecord) => {
        if (user?.role !== "Admin") {
          alert("Unauthorized: Only Administrators can alter patient records.");
          return;
        }

        setPatientRecords(prev => ({
          ...prev,
          [updatedRecord.id]: updatedRecord
        }));

        logAccess(
          "PATIENT_RECORD_ALTERED",
          `Administrator ${user.name} modified clinical details for ${updatedRecord.id} (${updatedRecord.name})`
        );

        setEditingPatient(null);
        showToast(`Record ${updatedRecord.id} successfully updated.`, "success");
      };

      // Add New Document to Patient Record (via Browse or Drag-and-Drop)
      const handleAddDocument = (patientId, newDoc) => {
        setPatientRecords(prev => {
          const patient = prev[patientId] || prev["PAT-2026-001"];
          if (!patient) return prev;
          
          const currentDocs = patient.uploadedDocuments || [];
          const updated = {
            ...patient,
            uploadedDocuments: [newDoc, ...currentDocs]
          };
          return {
            ...prev,
            [patientId]: updated
          };
        });

        logAccess(
          "PATIENT_DOC_ADDED",
          `${user?.role || 'Staff'} ${user?.name || 'Staff'} uploaded document [${newDoc.documentId} - ${newDoc.title}] for patient ${patientId}`
        );
        showToast(`Document "${newDoc.title}" successfully added.`, "success");
      };

      // Remove Document from Patient Record
      const handleRemoveDocument = (patientId, docId) => {
        const patient = patientRecords[patientId] || patientRecords["PAT-2026-001"];
        if (!patient) return;

        const confirmRemove = window.confirm(
          `Are you sure you want to remove document ${docId} from patient record ${patientId}?`
        );
        if (!confirmRemove) return;

        setPatientRecords(prev => {
          const pat = prev[patientId] || prev["PAT-2026-001"];
          if (!pat) return prev;

          // Check if it's in uploadedDocuments
          const currentUploaded = pat.uploadedDocuments || [];
          const updatedUploaded = currentUploaded.filter(d => d.documentId !== docId);

          let updatedPat = { ...pat, uploadedDocuments: updatedUploaded };

          // If it was preRecord or postRecord, allow clearing if deleted
          if (pat.preRecord && pat.preRecord.documentId === docId) {
            updatedPat.preRecord = null;
          }
          if (pat.postRecord && pat.postRecord.documentId === docId) {
            updatedPat.postRecord = null;
          }

          return {
            ...prev,
            [patientId]: updatedPat
          };
        });

        logAccess(
          "PATIENT_DOC_REMOVED",
          `${user?.role || 'Staff'} ${user?.name || 'Staff'} removed document [${docId}] from patient ${patientId}`
        );
        showToast(`Document ${docId} removed from patient record.`, "info");
      };

      const handleLogout = () => {
        if (user) {
          logAccess("STAFF_LOGOUT", `User ${user.name} logged out`);
        }
        setUser(null);
        setView("main");
        setSelectedPatientId(null);
        setIsPinVerified(false);
        setPinInput("");
        setPatientIdInput("");
        setLoginError("");
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-50 text-slate-900">
          {/* Notification Toast */}
          {notification && (
            <div className={`fixed top-18 right-6 z-50 px-4 py-3 rounded-xl shadow-lg border text-xs font-semibold flex items-center space-x-2 screen-fade ${
              notification.type === 'warning' 
                ? 'bg-amber-50 border-amber-300 text-amber-900' 
                : 'bg-emerald-50 border-emerald-300 text-emerald-900'
            }`}>
              <span>{notification.type === 'warning' ? '⚠️' : '✅'}</span>
              <span>{notification.message}</span>
            </div>
          )}

          {/* Top Clinical Header */}
          <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => user ? setView("dashboard") : setView("main")}>
                <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20 font-bold text-lg">
                  +
                </div>
                <div>
                  <span className="font-bold text-lg tracking-tight flex items-center gap-2">
                    PulseCare <span className="text-[11px] font-semibold tracking-wider px-2 py-0.5 bg-blue-950 text-blue-300 rounded border border-blue-800">HMS + EMR</span>
                  </span>
                  <p className="text-xs text-slate-400 hidden sm:block">Hospital Information & Clinical Records Portal</p>
                </div>
              </div>

              {/* Header Right: ESP32 Status Pill & User Profile */}
              <div className="flex items-center space-x-3">
                {/* Live ESP32 RFID Status Indicator */}
                <div className={`flex items-center space-x-2 text-xs px-2.5 py-1.5 rounded-lg border transition-all ${
                  esp32Status.connected 
                    ? 'bg-emerald-950/80 text-emerald-300 border-emerald-700/60' 
                    : 'bg-slate-800 text-slate-400 border-slate-700'
                }`}>
                  <span className={`w-2 h-2 rounded-full ${esp32Status.connected ? 'bg-emerald-400 badge-pulse' : 'bg-slate-500'}`}></span>
                  <span className="font-mono font-medium">
                    {esp32Status.connected ? `RC522 RFID: Ready (${esp32Status.port || 'USB'})` : 'RFID Reader: Disconnected'}
                  </span>
                </div>

                {user && (
                  <div className={`flex items-center space-x-2 px-3 py-1.5 rounded-lg border text-xs ${
                    user.isEmergencyAccess 
                      ? 'bg-rose-950 text-rose-200 border-rose-800' 
                      : 'bg-slate-800 text-slate-200 border-slate-700'
                  }`}>
                    <span className={`w-2 h-2 rounded-full ${user.isEmergencyAccess ? 'bg-rose-500 badge-pulse' : 'bg-blue-400'}`}></span>
                    <span className="font-medium">{user.name}</span>
                    <span className={`text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded ${
                      user.isEmergencyAccess ? 'bg-rose-900 text-rose-100' : 'bg-blue-900 text-blue-200'
                    }`}>
                      {user.role} {user.isEmergencyAccess && '🚨 BYPASS'}
                    </span>
                    <button 
                      onClick={handleLogout}
                      className="ml-2 text-rose-400 hover:text-rose-300 hover:underline border-l border-slate-700 pl-2">
                      Sign out
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Dynamic Content Views */}
          <main className="flex-1 flex flex-col">
            {view === "main" && (
              <MainLandingPage 
                onEnterLogin={(role) => {
                  setSelectedRole(role);
                  setView("login");
                }} 
              />
            )}

            {view === "login" && (
              <UnifiedLoginScreen 
                selectedRole={selectedRole}
                setSelectedRole={setSelectedRole}
                loginError={loginError}
                onSubmit={handleLoginSubmit}
                onBack={() => setView("main")}
              />
            )}

            {view === "dashboard" && (
              <HospitalDashboardLayout 
                user={user}
                sidebarTab={sidebarTab}
                setSidebarTab={setSidebarTab}
                patientRecords={patientRecords}
                rooms={rooms}
                setRooms={setRooms}
                departments={departments}
                setDepartments={setDepartments}
                staffUsers={staffUsers}
                setStaffUsers={setStaffUsers}
                onNavigateRecords={() => setView("patient-lookup")}
                onDeletePatient={handleDeletePatient}
                onEditPatient={(p) => setEditingPatient(p)}
                onOpenAddRoom={() => setShowAddRoomModal(true)}
                onOpenAddDoctor={() => setShowAddDoctorModal(true)}
                auditLogs={auditLogs}
                esp32Status={esp32Status}
              />
            )}

            {view === "patient-lookup" && (
              <PatientLookupScreen 
                patientIdInput={patientIdInput}
                setPatientIdInput={setPatientIdInput}
                lookupError={lookupError}
                onSubmit={handleLookupSubmit}
                onBack={() => setView("dashboard")}
                esp32Status={esp32Status}
                isScanningAnimation={isScanningAnimation}
                lastCardScan={lastCardScan}
                onSimulateScan={() => {
                  setPatientIdInput("PAT-2026-001");
                  const targetRecord = patientRecords["PAT-2026-001"];
                  const userRole = user?.role;
                  if (userRole === "EMT" || userRole === "Doctor") {
                    setPendingRfidBypass({ targetId: "PAT-2026-001", cardUID: "SIM-RFID-99", targetRecord });
                  } else {
                    setSelectedPatientId("PAT-2026-001");
                    setIsPinVerified(false);
                    setPinInput("");
                    logAccess("SIMULATED_CARD_SCAN", "Simulated RFID card tap for PAT-2026-001. Advanced to PIN verification gate.");
                    setView("consent");
                  }
                }}
              />
            )}

            {view === "consent" && (
              <ConsentVerificationScreen 
                patientId={selectedPatientId}
                pinInput={pinInput}
                setPinInput={setPinInput}
                consentError={consentError}
                onSubmit={handleConsentSubmit}
                user={user}
                onBack={() => setView("patient-lookup")}
              />
            )}

            {view === "patient-record" && (
              <PatientEMRDashboard 
                patientId={selectedPatientId}
                record={patientRecords[selectedPatientId] || INITIAL_PATIENT_RECORDS["PAT-2026-001"]}
                user={user}
                onEditPatient={(rec) => setEditingPatient(rec)}
                onDeletePatient={handleDeletePatient}
                onAddDocument={handleAddDocument}
                onRemoveDocument={handleRemoveDocument}
                onBackToLookup={() => {
                  setIsPinVerified(false);
                  setPinInput("");
                  setView("patient-lookup");
                }}
                onBackToDashboard={() => {
                  setIsPinVerified(false);
                  setPinInput("");
                  setView("dashboard");
                }}
              />
            )}
          </main>

          {/* ADMIN: Edit Patient Modal */}
          {editingPatient && (
            <AdminEditPatientModal 
              patient={editingPatient}
              onClose={() => setEditingPatient(null)}
              onSave={handleSaveEditedPatient}
            />
          )}

          {/* ADMIN & RECEPTIONIST: Add Room & Bed Modal */}
          {showAddRoomModal && (
            <AddRoomBedModal
              onClose={() => setShowAddRoomModal(false)}
              onAddRoom={(newRoom) => {
                setRooms(prev => [...prev, newRoom]);
                logAccess(
                  "ROOM_BED_ADDED",
                  `${user?.role} ${user?.name} added new bed allocation: ${newRoom.room} (${newRoom.ward} - ${newRoom.bed})`
                );
                showToast(`New Room/Bed ${newRoom.room} added successfully!`, "success");
                setShowAddRoomModal(false);
              }}
            />
          )}

          {/* ADMIN ONLY: Add Doctor & Assign Department Modal */}
          {showAddDoctorModal && user?.role === "Admin" && (
            <AddDoctorModal
              departments={departments}
              onClose={() => setShowAddDoctorModal(false)}
              onAddDoctor={(newDoc) => {
                setStaffUsers(prev => [...prev, newDoc]);
                // Increment doctor count in the assigned department
                setDepartments(prev => prev.map(d => {
                  if (d.name === newDoc.dept) {
                    return { ...d, doctors: (d.doctors || 0) + 1 };
                  }
                  return d;
                }));
                logAccess(
                  "DOCTOR_STAFF_ADDED",
                  `Administrator ${user?.name} added and assigned ${newDoc.name} to ${newDoc.dept}`
                );
                showToast(`Dr. ${newDoc.name} assigned to ${newDoc.dept}!`, "success");
                setShowAddDoctorModal(false);
              }}
            />
          )}

          {/* EMERGENCY RFID DIRECT BYPASS WARNING MODAL (EMT & DOCTORS) */}
          {pendingRfidBypass && (
            <EmergencyRfidWarningModal
              bypassData={pendingRfidBypass}
              user={user}
              onConfirm={confirmEmergencyRfidBypass}
              onFallbackToPin={() => {
                const target = pendingRfidBypass.targetRecord;
                setSelectedPatientId(target.id);
                setIsPinVerified(false);
                setPinInput("");
                setPendingRfidBypass(null);
                setView("consent");
              }}
              onCancel={() => setPendingRfidBypass(null)}
            />
          )}

          {/* Footer */}
          <footer className="mt-auto border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-500">
            <p>PulseCare Hospital Information System &bull; Electronic Medical Records &bull; Audit Trail & Compliance Enabled</p>
          </footer>
        </div>
      );
    }

    // ==========================================
    // 3H. ADMIN PORTAL: GEMINI CLINICAL AI LAYER MANAGEMENT
    // ==========================================
    function DashboardGeminiAITab({ patientRecords, onNavigateRecords }) {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("gemini_api_key") || "");
      const [selectedModel, setSelectedModel] = useState(() => localStorage.getItem("gemini_model") || "gemini-1.5-flash");
      const [savedSuccess, setSavedSuccess] = useState(false);
      const [testStatus, setTestStatus] = useState(null);
      const [testing, setTesting] = useState(false);

      const handleSaveConfig = (e) => {
        e.preventDefault();
        localStorage.setItem("gemini_api_key", apiKey.trim());
        localStorage.setItem("gemini_model", selectedModel);
        setSavedSuccess(true);
        setTimeout(() => setSavedSuccess(false), 3000);
      };

      const handleClearKey = () => {
        localStorage.removeItem("gemini_api_key");
        setApiKey("");
        setTestStatus({ success: true, mode: "LOCAL_SYNTHESIS", message: "Key cleared. System reverted to Built-in Clinical Intelligence Engine." });
      };

      const handleTestConnection = async () => {
        setTesting(true);
        setTestStatus(null);
        try {
          const testPatient = patientRecords["PAT-2026-001"] || Object.values(patientRecords)[0];
          const res = await fetch("/api/gemini/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              apiKey: apiKey.trim(),
              model: selectedModel,
              patientData: testPatient,
              preRecord: testPatient?.preRecord,
              postRecord: testPatient?.postRecord
            })
          });
          const data = await res.json();
          setTestStatus(data);
        } catch (err) {
          setTestStatus({ success: false, error: err.message });
        } finally {
          setTesting(false);
        }
      };

      const patientCount = Object.keys(patientRecords).length;

      return (
        <div className="space-y-6 screen-fade">
          {/* Admin Header */}
          <div className="glass-card rounded-2xl p-6 border-2 border-indigo-200 bg-gradient-to-r from-indigo-50/60 via-purple-50/40 to-white">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="flex items-center space-x-4">
                <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 text-white flex items-center justify-center text-2xl shadow-lg shadow-indigo-500/25">
                  ✨
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h2 className="text-xl font-bold text-slate-900">Gemini Clinical AI Architecture Management</h2>
                    <span className="text-[10px] font-bold uppercase tracking-wider bg-purple-100 text-purple-800 px-2.5 py-0.5 rounded-full border border-purple-200">
                      Admin Control Only
                    </span>
                  </div>
                  <p className="text-xs text-slate-600 mt-1 max-w-2xl leading-relaxed">
                    Centrally manage Google Gemini LLM API keys, model tiering (Gemini 1.5/2.0 Flash/Pro), and multi-document parsing rules. Clinical staff across Doctor, EMT, and Reception roles view only the verified AI priority reports and watchlists.
                  </p>
                </div>
              </div>

              <div className="text-right text-xs text-slate-500 bg-white/80 p-3 rounded-xl border border-indigo-100 hidden sm:block">
                <div>Active Registry: <strong className="text-slate-900">{patientCount} Patients</strong></div>
                <div>Engine: <span className="font-mono text-indigo-700 font-bold">{apiKey ? selectedModel : "Built-in Rule Engine"}</span></div>
              </div>
            </div>
          </div>

          {/* Configuration Form Card */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 glass-card rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
              <div className="flex items-center justify-between border-b pb-3">
                <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                  <span>🔑</span>
                  <span>Google AI Studio / Gemini API Configuration</span>
                </h3>
                {savedSuccess && (
                  <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200 animate-pulse">
                    ✓ Configuration Saved!
                  </span>

              </div>

              <form onSubmit={handleSaveConfig} className="space-y-4 text-xs">

                  <label className="block font-semibold text-slate-700 mb-1.5">
                    Google AI Studio API Key
                  </label>
                  <div className="relative">
                    <input
                      type="password"
                      placeholder="AIzaSy..."
                      value={apiKey}
                      onChange={(e) => setApiKey(e.target.value)}
                      className="w-full pl-3 pr-24 py-2.5 border rounded-xl font-mono text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    />
                    {apiKey && (
                      <button
                        type="button"
                        onClick={handleClearKey}
                        className="absolute right-2 top-1/2 -translate-y-1/2 px-2.5 py-1 text-[11px] font-semibold text-rose-600 hover:bg-rose-50 rounded-lg transition-colors"
                      >
                        Clear

                  <p className="text-[11px] text-slate-400 mt-1">

                    <select

                      onChange={(e) => setSelectedModel(e.target.value)}

                </div>

                <div className="flex items-center justify-between pt-2">
                  <button
                    type="button"

                    className="px-4 py-2 rounded-xl border border-indigo-200 text-indigo-700 hover:bg-indigo-50 font-bold transition-colors flex items-center gap-1.5 disabled:opacity-50"
                  >
                    <span>{testing ? "⏳" : "🧪"}</span>
                    <span>{testing ? "Testing Pipeline..." : "Test AI Model Pipeline"}</span>
                  </button>

                    type="submit"

    // ==========================================
    // 6. PATIENT MEDICAL RECORD — EMR DASHBOARD (With Admin Alter/Delete)
        // ==========================================
    // 6. PATIENT MEDICAL RECORD — EMR DASHBOARD (With Document Switcher & Dual Records)
    // ==========================================
    function PatientEMRDashboard({ patientId, record, user, onEditPatient, onDeletePatient, onAddDocument, onRemoveDocument, onBackToLookup, onBackToDashboard }) {
      // Document Switcher State: 'DOC-POST' | 'DOC-PRE' | 'DOC-FULL-REPORT' | or custom uploaded documentId
      const [selectedDocId, setSelectedDocId] = useState("DOC-POST");
      const [showUploadModal, setShowUploadModal] = useState(false);
      const [uploadCategory, setUploadCategory] = useState("xray");
      const [isDragging, setIsDragging] = useState(false);
      const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);
      const [diagPdfError, setDiagPdfError] = useState("");
      const [zoomedImage, setZoomedImage] = useState(null);
      const reportSheetRef = React.useRef(null);

      // Compute lab/vital status dynamically from value vs referenceRange (never hardcoded)
      const computeLabStatus = (value, referenceRange) => {
        if (!referenceRange || typeof referenceRange !== "string" || !referenceRange.includes("-")) {
          return null;
        }
        const num = parseFloat(String(value).replace(/,/g, "").trim());
        const parts = referenceRange.split("-").map(s => parseFloat(s.trim()));
        if (isNaN(num) || parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1])) {
          return null;
        }
        const [low, high] = parts;
        const span = Math.max(high - low, 0.1);
        if (num >= low && num <= high) {
          return {
            label: "Normal",
            level: "normal",
            badgeClass: "bg-emerald-100 text-emerald-800 border-emerald-200"
          };
        }
        const deviation = num < low ? (low - num) / span : (num - high) / span;
        if (deviation >= 0.35) {
          return {
            label: num < low ? "Critical Low" : "Critical High",
            level: "critical",
            badgeClass: "bg-rose-100 text-rose-800 border-rose-300"
          };
        }
        return {
          label: num < low ? "Low" : "High",
          level: "abnormal",
          badgeClass: "bg-amber-100 text-amber-800 border-amber-200"
        };
      };

      // Shared jsPDF Diagnostic Report Generator (used by X-Ray, Blood, and Cardiac PDF buttons)
      const generateDiagnosticPdf = ({ reportTitle, reportSubtitle, filename, infoBlocks = [], tables = [] }) => {
        setDiagPdfError("");
        if (!record) return;
        const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
        if (!jsPDFCtor) {
          setDiagPdfError("PDF library (jsPDF) is not loaded. Please check your internet connection and refresh.");
          return;
        }
        try {
          const doc = new jsPDFCtor({ unit: "mm", format: "a4", orientation: "portrait" });
          const pageW = 210;
          const pageH = 297;
          const margin = 14;
          const contentW = pageW - margin * 2;
          const accentRGB = [153, 27, 27];
          const darkRGB = [15, 23, 42];
          const bodyRGB = [51, 65, 85];
          const mutedRGB = [100, 116, 139];
          let y = 15;
          const genTimestamp = `${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;

          const drawHeader = () => {
            // PulseCare HMS Blue + Logo
            doc.setFillColor(37, 99, 235);
            doc.roundedRect(margin, y - 3, 11, 11, 2, 2, "F");
            doc.setFillColor(255, 255, 255);
            doc.rect(margin + 4.6, y - 0.6, 1.8, 6.2, "F");
            doc.rect(margin + 2.4, y + 1.6, 6.2, 1.8, "F");

            doc.setFont("helvetica", "bold");
            doc.setFontSize(13);
            doc.setTextColor(...darkRGB);
            doc.text("PulseCare HMS", margin + 14, y + 1.5);
            doc.setFontSize(7.2);
            doc.setTextColor(37, 99, 235);
            doc.text("HOSPITAL MANAGEMENT & DIAGNOSTIC REPORTS", margin + 14, y + 5.5, { charSpace: 0.4 });

            doc.setFontSize(7.5);
            doc.setTextColor(...accentRGB);
            doc.text("CONFIDENTIAL  -  DIAGNOSTIC REPORT", pageW - margin, y + 1.5, { align: "right", charSpace: 0.5 });
            doc.setFont("helvetica", "normal");
            doc.setTextColor(...mutedRGB);
            doc.text(post?.facility || pre?.facility || "PulseCare Clinical Hospital", pageW - margin, y + 5.5, { align: "right" });
            y += 12;

            doc.setFont("helvetica", "bold");
            doc.setFontSize(17);
            doc.setTextColor(...darkRGB);
            doc.text(reportTitle, margin, y);
            y += 5;
            if (reportSubtitle) {
              doc.setFont("helvetica", "italic");
              doc.setFontSize(8.5);
              doc.setTextColor(...mutedRGB);
              doc.text(reportSubtitle, margin, y);
              y += 5;
            }

            // Patient Info Strip
            doc.setFillColor(239, 246, 255);
            doc.setDrawColor(191, 219, 254);
            doc.setLineWidth(0.3);
            doc.rect(margin, y, contentW, 12, "FD");
            doc.setFont("helvetica", "bold");
            doc.setFontSize(9);
            doc.setTextColor(...darkRGB);
            doc.text(`${record.name || "Unknown"} (${record.id || "N/A"})`, margin + 3, y + 4.8);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(7.8);
            doc.setTextColor(...bodyRGB);
            doc.text(`Age/Sex: ${record.age || "-"} / ${record.sex || "-"}   |   Blood Group: ${record.bloodGroup || "-"}`, margin + 3, y + 9.4);
            doc.text(`Date: ${genTimestamp}`, pageW - margin - 3, y + 4.8, { align: "right" });
            y += 16;
          };

          const ensureSpace = (needed = 14) => {
            if (y + needed > pageH - 22) {
              doc.addPage();
              y = 16;
            }
          };

          const drawSectionTitle = (secTitle) => {
            ensureSpace(12);
            doc.setFillColor(254, 242, 242);
            doc.rect(margin, y, contentW, 6, "F");
            doc.setFillColor(...accentRGB);
            doc.rect(margin, y, 1.5, 6, "F");
            doc.setFont("helvetica", "bold");
            doc.setFontSize(8.8);
            doc.setTextColor(...accentRGB);
            doc.text(secTitle.toUpperCase(), margin + 4, y + 4.2, { charSpace: 0.6 });
            y += 9;
          };

          drawHeader();

          // Info Blocks (key-value narrative blocks)
          infoBlocks.forEach((blk) => {
            drawSectionTitle(blk.heading);
            (blk.rows || []).forEach((r) => {
              ensureSpace(10);
              doc.setFont("helvetica", "bold");
              doc.setFontSize(8.2);
              doc.setTextColor(...darkRGB);
              doc.text(`${r.label}:`, margin + 1, y);
              doc.setFont("helvetica", "normal");
              doc.setTextColor(...bodyRGB);
              const wrapped = doc.splitTextToSize(String(r.value || "-"), contentW - 36);
              doc.text(wrapped, margin + 35, y);
              y += Math.max(4.5, wrapped.length * 4.1) + 1;
            });
            y += 2;
          });

          // Reusable Parameter / Value / Unit / ReferenceRange / Status Table Renderer
          tables.forEach((tbl) => {
            if (!tbl.rows || tbl.rows.length === 0) return;
            drawSectionTitle(tbl.heading);
            ensureSpace(12);
            // Table Header
            doc.setFillColor(241, 245, 249);
            doc.rect(margin, y, contentW, 6, "F");
            doc.setFont("helvetica", "bold");
            doc.setFontSize(7.5);
            doc.setTextColor(...darkRGB);
            doc.text("PARAMETER", margin + 2, y + 4.1);
            doc.text("VALUE", margin + 68, y + 4.1);
            doc.text("UNIT", margin + 96, y + 4.1);
            doc.text("REFERENCE RANGE", margin + 124, y + 4.1);
            doc.text("STATUS", margin + 160, y + 4.1);
            y += 7;

            tbl.rows.forEach((row, idx) => {
              ensureSpace(7);
              if (idx % 2 === 1) {
                doc.setFillColor(248, 250, 252);
                doc.rect(margin, y - 3.6, contentW, 5.5, "F");
              }
              const computed = computeLabStatus(row.value, row.referenceRange);
              const statusLabel = computed ? computed.label : (row.status || "-");
              doc.setFont("helvetica", "bold");
              doc.setFontSize(7.8);
              doc.setTextColor(...darkRGB);
              doc.text(String(row.parameter || "-").slice(0, 34), margin + 2, y);
              doc.setFont("helvetica", "normal");
              doc.text(String(row.value ?? "-"), margin + 68, y);
              doc.text(String(row.unit || "-"), margin + 96, y);
              doc.text(String(row.referenceRange || "-"), margin + 124, y);
              if (computed?.level === "critical") doc.setTextColor(185, 28, 28);
              else if (computed?.level === "abnormal") doc.setTextColor(180, 83, 9);
              else if (computed?.level === "normal") doc.setTextColor(4, 120, 87);
              else doc.setTextColor(...mutedRGB);
              doc.setFont("helvetica", "bold");
              doc.text(statusLabel, margin + 160, y);
              y += 5.5;
            });
            y += 3;
          });

          // Footers on all pages
          const totalPages = doc.internal.getNumberOfPages();
          for (let p = 1; p <= totalPages; p++) {
            doc.setPage(p);
            const fy = pageH - 11;
            doc.setDrawColor(226, 232, 240);
            doc.line(margin, fy - 4, pageW - margin, fy - 4);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(7.2);
            doc.setTextColor(...mutedRGB);
            doc.text(`Generated by ${user?.name || "PulseCare EMR"} (${genTimestamp})  |  CONFIDENTIAL - Clinical use only`, margin, fy);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(...accentRGB);
            doc.text(`Page ${p} of ${totalPages}`, pageW - margin, fy, { align: "right" });
          }

          doc.save(filename);
        } catch (err) {
          console.error("Diagnostic PDF generation failed:", err);
          setDiagPdfError(`Failed to generate PDF: ${err.message || "Unknown error"}`);
        }
      };

      const downloadXRayPdf = () => {
        const rad = post?.radiology;
        if (!rad) return;
        generateDiagnosticPdf({
          reportTitle: "Radiology / X-Ray Report",
          reportSubtitle: rad.studyName || rad.investigation || "Diagnostic Imaging Study",
          filename: `${record?.id || "PATIENT"}_XRay_Report.pdf`,
          infoBlocks: [
            {
              heading: "Study Information",
              rows: [
                { label: "Study Name", value: rad.studyName || rad.investigation },
                { label: "Study Date", value: rad.date },
                { label: "Radiologist", value: rad.radiologist || "Attending Radiologist" },
                ...(rad.priorComparison ? [{ label: "Prior Comparison", value: rad.priorComparison }] : [])
              ]
            },
            {
              heading: "Radiology Findings & Impression",
              rows: [
                { label: "Findings", value: rad.findings },
                { label: "Impression", value: rad.impression }
              ]
            }
          ]
        });
      };

      const downloadBloodPdf = () => {
        const lab = post?.laboratory;
        const trt = post?.treatment;
        if (!lab && !trt?.postopCBC) return;
        const tables = [];
        if (lab?.cbc?.length) tables.push({ heading: `Pre-Op / Initial CBC (${lab.dateTime || post?.encounterDates || ""})`, rows: lab.cbc });
        if (lab?.coagulation?.length) tables.push({ heading: "Pre-Op Coagulation Panel", rows: lab.coagulation });
        if (lab?.chemistry?.length) tables.push({ heading: "Pre-Op Chemistry & Metabolic Panel", rows: lab.chemistry });
        if (trt?.postopCBC?.length) tables.push({ heading: `Post-Op CBC (${trt.postopDateTime || ""})`, rows: trt.postopCBC });
        if (trt?.postopCoagulation?.length) tables.push({ heading: "Post-Op Coagulation", rows: trt.postopCoagulation });
        if (trt?.postopChemistry?.length) tables.push({ heading: "Post-Op Chemistry", rows: trt.postopChemistry });
        generateDiagnosticPdf({
          reportTitle: "Blood & Laboratory Report",
          reportSubtitle: "Complete Blood Count (CBC), Coagulation & Chemistry Panel",
          filename: `${record?.id || "PATIENT"}_Blood_Report.pdf`,
          tables
        });
      };

      const downloadCardiacPdf = () => {
        const preC = pre?.cardiacAssessment;
        const postC = post?.cardiacAssessment;
        if (!preC && !postC) return;
        const infoBlocks = [];
        if (postC) {
          infoBlocks.push({
            heading: "Inpatient / Post-Event Cardiac Assessment",
            rows: [
              { label: "ECG Rhythm / Rate", value: postC.ecgDetails ? `${postC.ecgDetails.rhythm} (${postC.ecgDetails.rate})` : (postC.ecgFindings || "-") },
              ...(postC.ecgDetails ? [
                { label: "Intervals / Axis", value: `${postC.ecgDetails.intervals} | ${postC.ecgDetails.axis}` },
                { label: "ECG Interpretation", value: postC.ecgDetails.interpretation }
              ] : []),
              ...(postC.echoDetails ? [
                { label: "Ejection Fraction", value: `${postC.echoDetails.ejectionFraction}%` },
                { label: "Chambers & Valves", value: `${postC.echoDetails.chamberSizes}; ${postC.echoDetails.valveFindings}` },
                { label: "Wall Motion", value: `${postC.echoDetails.wallMotion}; Pericardial Effusion: ${postC.echoDetails.pericardialEffusion}` }
              ] : []),
              ...(postC.telemetry ? [
                { label: "Telemetry", value: `${postC.telemetry.durationHours} hrs — ${(postC.telemetry.events && postC.telemetry.events.length) ? postC.telemetry.events.join("; ") : "No arrhythmia events"}` }
              ] : [])
            ]
          });
        }
        if (preC) {
          infoBlocks.push({
            heading: "Baseline / Pre-Accident Cardiac Assessment",
            rows: [
              { label: "Baseline ECG", value: preC.ecgDetails ? `${preC.ecgDetails.rhythm} (${preC.ecgDetails.rate}) - ${preC.ecgDetails.interpretation}` : (preC.ecg || "-") },
              { label: "Baseline Echo", value: preC.echoDetails ? `EF ${preC.echoDetails.ejectionFraction}% — ${preC.echoDetails.wallMotion}` : (preC.echo || "-") },
              { label: "Summary Findings", value: preC.findings || "-" }
            ]
          });
        }
        generateDiagnosticPdf({
          reportTitle: "Cardiac & Telemetry Assessment Report",
          reportSubtitle: "12-Lead ECG, Echocardiography & Continuous Telemetry",
          filename: `${record?.id || "PATIENT"}_Cardiac_Report.pdf`,
          infoBlocks
        });
      };

      // Direct 1-Page PDF Download Helper (jsPDF clean clinical layout)
      const downloadOnePagePdf = () => {
        if (!record) return;
        const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
        if (!jsPDFCtor) {
          document.body.classList.add("printing-one-page");
          window.print();
          setTimeout(() => document.body.classList.remove("printing-one-page"), 500);
          return;
        }
        setIsGeneratingPdf(true);
        try {
          const doc = new jsPDFCtor({ unit: "mm", format: "a4", orientation: "portrait" });
          const pageW = 210;
          const margin = 14;
          const contentW = pageW - margin * 2; // 182mm
          const accentRGB = [153, 27, 27]; // Deep clinical crimson
          const darkRGB = [15, 23, 42];
          const bodyRGB = [51, 65, 85];
          const mutedRGB = [100, 116, 139];
          let y = 15;

          const writeWrapped = (text, x, currY, maxW, lineH = 4.2, maxLines = 12) => {
            const rawLines = doc.splitTextToSize(String(text || "-"), maxW);
            const lines = rawLines.slice(0, maxLines);
            doc.text(lines, x, currY);
            return currY + lines.length * lineH;
          };

          const drawSectionHeader = (title) => {
            doc.setFillColor(254, 242, 242);
            doc.rect(margin, y, contentW, 6.2, "F");
            doc.setFillColor(...accentRGB);
            doc.rect(margin, y, 1.5, 6.2, "F");
            doc.setFont("helvetica", "bold");
            doc.setFontSize(9);
            doc.setTextColor(...accentRGB);
            doc.text(title, margin + 4, y + 4.3, { charSpace: 0.7 });
            y += 9.5;
          };

          const drawField = (label, value, x, currY, maxW = 55) => {
            doc.setFont("helvetica", "bold");
            doc.setFontSize(6.8);
            doc.setTextColor(...mutedRGB);
            doc.text(String(label).toUpperCase(), x, currY, { charSpace: 0.4 });
            doc.setFont("helvetica", "bold");
            doc.setFontSize(9);
            doc.setTextColor(...darkRGB);
            const valLines = doc.splitTextToSize(String(value || "-"), maxW).slice(0, 2);
            doc.text(valLines, x, currY + 4);
            return currY + 4 + valLines.length * 3.8;
          };

          // 1. Hospital Logo + Brand Header
          // Blue rounded medical cross badge
          doc.setFillColor(37, 99, 235);
          doc.roundedRect(margin, y - 3, 11, 11, 2, 2, "F");
          doc.setFillColor(255, 255, 255);
          doc.rect(margin + 4.6, y - 0.6, 1.8, 6.2, "F"); // vertical bar of +
          doc.rect(margin + 2.4, y + 1.6, 6.2, 1.8, "F"); // horizontal bar of +

          // Hospital Name & Subtitle next to logo
          doc.setFont("helvetica", "bold");
          doc.setFontSize(13);
          doc.setTextColor(...darkRGB);
          doc.text("PulseCare HMS", margin + 14, y + 1.5);
          doc.setFont("helvetica", "bold");
          doc.setFontSize(7.2);
          doc.setTextColor(37, 99, 235);
          doc.text("HOSPITAL MANAGEMENT & CLINICAL RECORDS", margin + 14, y + 5.5, { charSpace: 0.5 });

          // Right-aligned confidentiality badge
          doc.setFont("helvetica", "bold");
          doc.setFontSize(7.5);
          doc.setTextColor(...accentRGB);
          doc.text("CONFIDENTIAL  -  CLINICAL RECORD", pageW - margin, y + 1.5, { align: "right", charSpace: 0.6 });
          doc.setFont("helvetica", "normal");
          doc.setFontSize(7.5);
          doc.setTextColor(...mutedRGB);
          doc.text(post?.facility || pre?.facility || "PulseCare Clinical Hospital", pageW - margin, y + 5.5, { align: "right" });
          y += 12.5;

          // Main Report Title
          doc.setFont("helvetica", "bold");
          doc.setFontSize(19);
          doc.setTextColor(...darkRGB);
          doc.text("Patient Medical Report", margin, y);
          y += 5;

          doc.setFont("helvetica", "italic");
          doc.setFontSize(8.5);
          doc.setTextColor(...mutedRGB);
          doc.text("Consolidated clinical summary for medical review and care handoff.", margin, y);
          y += 5;

          // 2. Highlighted Report ID & Patient Banner
          doc.setFillColor(239, 246, 255);
          doc.setDrawColor(191, 219, 254);
          doc.setLineWidth(0.3);
          doc.rect(margin, y, contentW, 9, "FD");
          doc.setFont("helvetica", "bold");
          doc.setFontSize(7.5);
          doc.setTextColor(30, 64, 175);
          doc.text("REPORT ID:", margin + 3, y + 5.7, { charSpace: 0.4 });
          doc.setFontSize(8.8);
          doc.setTextColor(...darkRGB);
          doc.text(String(record.id || "N/A"), margin + 23, y + 5.7);

          const genDate = `${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
          doc.setFontSize(8.2);
          doc.setTextColor(...darkRGB);
          doc.text(genDate, pageW - margin - 3, y + 5.7, { align: "right" });
          doc.setFontSize(7.5);
          doc.setTextColor(30, 64, 175);
          doc.text("GENERATED:", pageW - margin - 38, y + 5.7, { align: "right", charSpace: 0.4 });
          y += 13;

          // 3. Patient Heading & Information Section
          drawSectionHeader("PATIENT INFORMATION");
          // Highlighted Patient Name & Blood Group row
          doc.setFillColor(248, 250, 252);
          doc.rect(margin, y - 2.5, contentW, 9.5, "F");
          doc.setFont("helvetica", "bold");
          doc.setFontSize(7);
          doc.setTextColor(...mutedRGB);
          doc.text("PATIENT NAME", margin + 2, y + 0.5, { charSpace: 0.4 });
          doc.setFont("helvetica", "bold");
          doc.setFontSize(11.5);
          doc.setTextColor(...darkRGB);
          doc.text(String(record.name || "Unknown Patient"), margin + 2, y + 5.3);

          // Highlighted Blood Group pill on right
          doc.setFillColor(254, 226, 226);
          doc.roundedRect(pageW - margin - 46, y - 0.8, 44, 6.5, 1.5, 1.5, "F");
          doc.setFont("helvetica", "bold");
          doc.setFontSize(8.2);
          doc.setTextColor(...accentRGB);
          doc.text(`BLOOD: ${record.bloodGroup || "-"}`, pageW - margin - 24, y + 3.5, { align: "center" });
          y += 10.5;

          const row1Bottom = Math.max(
            drawField("Patient ID / MRN", record.id, margin, y, 42),
            drawField("Age / Sex", `${record.age || "-"} / ${record.sex || "-"}`, margin + 45, y, 36),
            drawField("Date of Birth", record.dob || "-", margin + 84, y, 36),
            drawField("Contact", record.contact || "N/A", margin + 123, y, 30),
            drawField("Status", "Discharged", margin + 155, y, 27)
          );
          y = row1Bottom + 4.5;

          // 4. Allergies & Active Conditions
          drawSectionHeader("ALLERGIES & ACTIVE CONDITIONS");
          doc.setFont("helvetica", "bold");
          doc.setFontSize(8.2);
          doc.setTextColor(...darkRGB);
          doc.text("Documented Allergies", margin, y);
          y += 4;
          doc.setFont("helvetica", "normal");
          doc.setFontSize(8.5);
          doc.setTextColor(...bodyRGB);
          const allergyText = (record.allergies && record.allergies.length > 0)
            ? record.allergies.map(a => `${a.name} (${a.severity}) - ${a.reaction}`).join("; ")
            : "No known drug allergies documented.";
          y = writeWrapped(allergyText, margin, y, contentW, 4.2, 3) + 2;

          doc.setFont("helvetica", "bold");
          doc.setFontSize(8.2);
          doc.setTextColor(...darkRGB);
          doc.text("Active Clinical Conditions", margin, y);
          y += 4;
          doc.setFont("helvetica", "normal");
          doc.setFontSize(8.5);
          doc.setTextColor(...bodyRGB);
          const condText = (record.currentConditions && record.currentConditions.length > 0)
            ? record.currentConditions.map(c => `- ${c}`).join("\n")
            : "None documented.";
          y = writeWrapped(condText, margin, y, contentW, 4.2, 4) + 4;

          // 5. Latest Vitals Grid (3 columns)
          if (record.vitals && record.vitals.length > 0) {
            drawSectionHeader("LATEST RECORDED VITALS");
            const colW = contentW / 3;
            const vitalsToShow = record.vitals.slice(0, 6);
            vitalsToShow.forEach((v, idx) => {
              const col = idx % 3;
              const row = Math.floor(idx / 3);
              const vx = margin + col * colW;
              const vy = y + row * 10;
              doc.setFont("helvetica", "bold");
              doc.setFontSize(6.8);
              doc.setTextColor(...mutedRGB);
              doc.text(String(v.name || "").toUpperCase(), vx, vy, { charSpace: 0.3 });
              doc.setFont("helvetica", "bold");
              doc.setFontSize(9);
              doc.setTextColor(...darkRGB);
              doc.text(`${v.value || "-"}`, vx, vy + 4);
              doc.setFont("helvetica", "normal");
              doc.setFontSize(7.5);
              doc.setTextColor(...mutedRGB);
              doc.text(String(v.status || ""), vx + 22, vy + 4);
            });
            y += Math.ceil(vitalsToShow.length / 3) * 10 + 3;
          }

          // 6. Two-Column Clinical Summary (Post-Accident vs Pre-Accident & Follow-Up)
          const colGap = 10;
          const halfW = (contentW - colGap) / 2;
          const leftX = margin;
          const rightX = margin + halfW + colGap;
          const colStartY = y;

          // Left Column Header (Bold & Highlighted)
          doc.setFillColor(254, 242, 242);
          doc.rect(leftX, colStartY, halfW, 6, "F");
          doc.setFillColor(...accentRGB);
          doc.rect(leftX, colStartY, 1.5, 6, "F");
          doc.setFont("helvetica", "bold");
          doc.setFontSize(8.8);
          doc.setTextColor(...accentRGB);
          doc.text("POST-ACCIDENT / INPATIENT", leftX + 3.5, colStartY + 4.2, { charSpace: 0.6 });

          // Right Column Header (Bold & Highlighted)
          doc.setFillColor(239, 246, 255);
          doc.rect(rightX, colStartY, halfW, 6, "F");
          doc.setFillColor(37, 99, 235);
          doc.rect(rightX, colStartY, 1.5, 6, "F");
          doc.setTextColor(30, 64, 175);
          doc.text("BASELINE & FOLLOW-UP", rightX + 3.5, colStartY + 4.2, { charSpace: 0.6 });

          let ly = colStartY + 9.5;
          let ry = colStartY + 9.5;
          const maxColY = 250;

          doc.setFontSize(8.2);
          doc.setTextColor(...bodyRGB);

          if (post) {
            if (post.diagnosis?.primary && ly < maxColY) {
              doc.setFont("helvetica", "bold");
              doc.setTextColor(...darkRGB);
              doc.text("Primary Diagnosis:", leftX, ly);
              ly += 3.8;
              doc.setFont("helvetica", "normal");
              doc.setTextColor(...bodyRGB);
              ly = writeWrapped(post.diagnosis.primary, leftX, ly, halfW, 4.0, 3) + 2;
            }
            if (post.treatment?.procedure && ly < maxColY) {
              doc.setFont("helvetica", "bold");
              doc.setTextColor(...darkRGB);
              doc.text(`Procedure (${post.treatment.procedureDate || "Inpatient"}):`, leftX, ly);
              ly += 3.8;
              doc.setFont("helvetica", "normal");
              doc.setTextColor(...bodyRGB);
              ly = writeWrapped(post.treatment.procedure, leftX, ly, halfW, 4.0, 3) + 2;
            }
            if (post.dischargeCondition?.summary && ly < maxColY) {
              doc.setFont("helvetica", "bold");
              doc.setTextColor(...darkRGB);
              doc.text(`Discharge (${post.dischargeCondition.date || "Recent"}):`, leftX, ly);
              ly += 3.8;
              doc.setFont("helvetica", "normal");
              doc.setTextColor(...bodyRGB);
              ly = writeWrapped(post.dischargeCondition.summary, leftX, ly, halfW, 4.0, 4) + 2;
            }
            if (post.dischargeMeds && post.dischargeMeds.length > 0 && ly < maxColY) {
              doc.setFont("helvetica", "bold");
              doc.setTextColor(...darkRGB);
              doc.text("Discharge Medications:", leftX, ly);
              ly += 3.8;
              doc.setFont("helvetica", "normal");
              doc.setTextColor(...bodyRGB);
              for (const m of post.dischargeMeds.slice(0, 4)) {
                if (ly >= maxColY) break;
                ly = writeWrapped(`- ${m.medication} (${m.dose})`, leftX, ly, halfW, 3.8, 2);
              }
            }
          } else {
            doc.setFont("helvetica", "normal");
            ly = writeWrapped("No inpatient/emergency encounter recorded.", leftX, ly, halfW, 4.0, 2);
          }

          if (pre) {
            if (pre.medicalHistory?.knownCondition && ry < maxColY) {
              doc.setFont("helvetica", "bold");
              doc.setTextColor(...darkRGB);
              doc.text(`Pre-Accident History (${pre.encounterDate || ""}):`, rightX, ry);
              ry += 3.8;
              doc.setFont("helvetica", "normal");
              doc.setTextColor(...bodyRGB);
              ry = writeWrapped(pre.medicalHistory.knownCondition, rightX, ry, halfW, 4.0, 3) + 2;
            }
            if (pre.currentMedications && pre.currentMedications.length > 0 && ry < maxColY) {
              doc.setFont("helvetica", "bold");
              doc.setTextColor(...darkRGB);
              doc.text("Baseline Medications:", rightX, ry);
              ry += 3.8;
              doc.setFont("helvetica", "normal");
              doc.setTextColor(...bodyRGB);
              for (const m of pre.currentMedications.slice(0, 3)) {
                if (ry >= maxColY) break;
                ry = writeWrapped(`- ${m.medication} ${m.dosage} (${m.frequency})`, rightX, ry, halfW, 3.8, 2);
              }
              ry += 2;
            }
          }

          if (post?.followUp && post.followUp.length > 0 && ry < maxColY) {
            doc.setFont("helvetica", "bold");
            doc.setTextColor(...darkRGB);
            doc.text("Follow-Up Instructions:", rightX, ry);
            ry += 3.8;
            doc.setFont("helvetica", "normal");
            doc.setTextColor(...bodyRGB);
            for (const item of post.followUp.slice(0, 4)) {
              if (ry >= maxColY) break;
              ry = writeWrapped(`- ${item}`, rightX, ry, halfW, 3.8, 2);
            }
          }

          // 7. Signature Block & Footer
          const sigY = 266;
          doc.setDrawColor(148, 163, 184);
          doc.setLineWidth(0.3);
          doc.line(leftX, sigY, leftX + 72, sigY);
          doc.line(rightX, sigY, rightX + 72, sigY);

          doc.setFont("helvetica", "bold");
          doc.setFontSize(8.5);
          doc.setTextColor(...darkRGB);
          doc.text(post?.attendingSurgeon || pre?.physician || "Attending Physician", leftX, sigY + 4.5);
          doc.text(post?.electronicSignature || pre?.electronicSignature || "PULSECARE-EMR-VERIFIED", rightX, sigY + 4.5);

          doc.setFont("helvetica", "italic");
          doc.setFontSize(7.5);
          doc.setTextColor(...mutedRGB);
          doc.text("Attending Clinician / Surgeon", leftX, sigY + 8.5);
          doc.text("Electronic Verification Signature", rightX, sigY + 8.5);

          const footerY = 285;
          doc.setDrawColor(226, 232, 240);
          doc.line(margin, footerY - 4, pageW - margin, footerY - 4);
          doc.setFont("helvetica", "normal");
          doc.setFontSize(7.5);
          doc.setTextColor(...mutedRGB);
          doc.text("PulseCare HMS Patient Report  -  CONFIDENTIAL  -  For clinical use only", margin, footerY);
          doc.setFont("helvetica", "bold");
          doc.setTextColor(...accentRGB);
          doc.text(`${record.id || "PATIENT"}  |  Page 1 of 1`, pageW - margin, footerY, { align: "right" });

          doc.save(`${record.id || "PATIENT"}_Full_Report.pdf`);
        } catch (err) {
          console.error("PDF generation failed, falling back to print:", err);
          document.body.classList.add("printing-one-page");
          window.print();
          setTimeout(() => document.body.classList.remove("printing-one-page"), 500);
        } finally {
          setIsGeneratingPdf(false);
        }
      };

      // Gemini Clinical AI Layer State
      const [aiAnalysis, setAiAnalysis] = useState(null);
      const [aiLoading, setAiLoading] = useState(false);
      const [aiError, setAiError] = useState("");
      const [showApiKeyModal, setShowApiKeyModal] = useState(false);
      const [geminiApiKey, setGeminiApiKey] = useState(() => localStorage.getItem("gemini_api_key") || "");
      const [aiExpanded, setAiExpanded] = useState(true);

      // Run Gemini AI Analysis
      const runGeminiAnalysis = async (customKey = null) => {
        setAiLoading(true);
        setAiError("");
        try {
          const keyToUse = customKey !== null ? customKey : geminiApiKey;
          const res = await fetch("/api/gemini/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              apiKey: keyToUse,
              model: "gemini-1.5-flash",
              patientData: record,
              preRecord: record.preRecord,
              postRecord: record.postRecord
            })
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || "Failed to generate AI analysis");
          }

          setAiAnalysis(data.data);
          setAiExpanded(true);
        } catch (err) {
          console.error("AI Analysis Error:", err);
          setAiError(err.message || "Failed to contact Gemini clinical layer");
        } finally {
          setAiLoading(false);
        }
      };

      // Auto-trigger analysis once on component mount if both records are present
      useEffect(() => {
        if (record?.preRecord && record?.postRecord && !aiAnalysis) {
          runGeminiAnalysis();
        }
      }, [record?.id]);

      const hasPre = !!record?.preRecord;
      const hasPost = !!record?.postRecord;
      const uploadedDocs = record?.uploadedDocuments || [];

      const pre = record?.preRecord;
      const post = record?.postRecord;

      // Find if selected document is an uploaded document
      const currentUploadedDoc = uploadedDocs.find(d => d.documentId === selectedDocId);

      // Handle file selection from input or drag-and-drop
      const handleFileProcess = (file) => {
        if (!file) return;
        const reader = new FileReader();
        const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
        const isImage = file.type.startsWith("image/");
        
        reader.onload = (e) => {
          const fileDataUrl = e.target.result;
          const newDocId = "DOC-UP-" + Date.now().toString().slice(-6);
          const newDoc = {
            documentId: newDocId,
            title: file.name.replace(/\.[^/.]+$/, ""),
            fileName: file.name,
            fileSize: (file.size / 1024).toFixed(1) + " KB",
            fileType: file.type || (isPdf ? "application/pdf" : "application/octet-stream"),
            uploadedAt: new Date().toLocaleString(),
            uploadedBy: `${user?.name || 'Authorized Staff'} (${user?.role || 'Staff'})`,
            category: uploadCategory || "other",
            parseStatus: "pending",
            dataUrl: fileDataUrl,
            notes: `Document uploaded via secure EMR portal (${(uploadCategory || "other").toUpperCase()}). Verified intact.`
          };

          if (onAddDocument) {
            onAddDocument(record.id, newDoc);
          }
          setSelectedDocId(newDocId);
          setShowUploadModal(false);
        };

        reader.readAsDataURL(file);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(true);
      };

      const handleDragLeave = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFileProcess(e.dataTransfer.files[0]);
        }
      };

      return (
        <div className="max-w-6xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 space-y-6 screen-fade">
          {/* Action Bar */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200">
            <div className="flex items-center space-x-2">
              <button 
                onClick={onBackToLookup}
                className="text-xs font-semibold text-slate-600 hover:text-slate-900 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm transition-colors hover:bg-slate-50">
                &larr; Patient Search
              </button>
              <button 
                onClick={onBackToDashboard}
                className="text-xs font-semibold text-blue-600 hover:text-blue-800 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-200 transition-colors hover:bg-blue-100">
                Hospital Dashboard
              </button>
            </div>

            <div className="flex items-center space-x-2">
              {user?.role === "Admin" && (
                <div className="flex items-center space-x-2 mr-2 border-r border-slate-200 pr-3">

              {/* A4 Single-Page Report Sheet */}

                  {/* 4. Current Vitals Strip */}

                    {/* Pre-Accident Baseline Summary */}
                    {pre && (

                          <div className="text-[10px]">

                        {pre.clinicalAssessment && (
                          <div className="text-[10px]">
                            <strong className="text-slate-800">Assessment:</strong> {pre.clinicalAssessment}
                          </div>

                        {pre.currentMedications && pre.currentMedications.length > 0 && (
                          <div className="pt-1 border-t border-slate-100">
                            <span className="text-[9px] font-bold uppercase text-slate-500 block">Baseline Medications:</span>
                            <ul className="list-disc list-inside text-[9.5px] text-slate-700">
                              {pre.currentMedications.map((m, i) => (
                                <li key={i}><strong>{m.medication}</strong> {m.dosage} ({m.frequency})</li>

                            </ul>
                          </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-0.5 text-[9.5px] text-slate-700">

                    </div>
                    <div className="font-mono">

                    </div>

          {/* VIEW 0B: X-RAY, BLOOD & DIAGNOSTIC REPORTS TAB */}
          {selectedDocId === "DOC-DIAGNOSTICS" && (() => {
            const rad = post?.radiology;
            const lab = post?.laboratory;
            const trt = post?.treatment;
            const preC = pre?.cardiacAssessment;
            const postC = post?.cardiacAssessment;

            // Collect critical flags across Blood & Cardiac (excluding pending-parse uploads)
            const criticalFlags = [];
            const scanLabList = (arr, phaseLabel) => {
              (arr || []).forEach((item) => {
                const st = computeLabStatus(item.value, item.referenceRange);
                if (st && st.level === "critical") {
                  criticalFlags.push(`${item.parameter} (${phaseLabel}): ${item.value} ${item.unit || ""} [${st.label}]`);
                }
              });
            };
            scanLabList(lab?.cbc, "Pre-Op CBC");
            scanLabList(lab?.coagulation, "Pre-Op Coag");
            scanLabList(lab?.chemistry, "Pre-Op Chem");
            scanLabList(trt?.postopCBC, "Post-Op CBC");
            scanLabList(trt?.postopCoagulation, "Post-Op Coag");
            scanLabList(trt?.postopChemistry, "Post-Op Chem");

            const postEf = postC?.echoDetails?.ejectionFraction;
            const preEf = preC?.echoDetails?.ejectionFraction;
            if (typeof postEf === "number" && postEf < 40) {
              criticalFlags.push(`Post-Event Echo Ejection Fraction: ${postEf}% (< 40% Critical)`);
            }
            if (typeof preEf === "number" && preEf < 40) {
              criticalFlags.push(`Baseline Echo Ejection Fraction: ${preEf}% (< 40% Critical)`);
            }
            if (postC?.telemetry?.events?.length) {
              postC.telemetry.events.forEach((ev) => criticalFlags.push(`Telemetry Event: ${ev}`));
            }

            const renderLabRow = (item, idx) => {
              const st = computeLabStatus(item.value, item.referenceRange);
              return (
                <tr key={idx} className="border-b border-slate-100 last:border-0 hover:bg-slate-50/70">
                  <td className="py-1.5 px-2 font-semibold text-slate-800">{item.parameter}</td>
                  <td className="py-1.5 px-2 font-mono font-bold text-slate-900">
                    {item.value} {item.unit ? <span className="text-[10px] font-normal text-slate-500">{item.unit}</span> : null}
                  </td>
                  <td className="py-1.5 px-2 font-mono text-[10px] text-slate-500">{item.referenceRange || "—"}</td>
                  <td className="py-1.5 px-2 text-right">
                    {st ? (
                      <span className={`inline-block text-[10px] font-bold px-2 py-0.5 rounded-full border ${st.badgeClass}`}>
                        {st.label}
                      </span>
                    ) : null}
                  </td>
                </tr>
              );
            };

            const categoryOrder = ["xray", "blood", "cardiac", "other"];
            const categoryLabels = {
              xray: "🩻 Radiology / X-Ray Scans",
              blood: "🩸 Blood & Lab Files",
              cardiac: "❤️ Cardiac & Telemetry Files",
              other: "📁 Other Clinical Documents"
            };
            const groupedUploads = categoryOrder.reduce((acc, cat) => {
              const items = uploadedDocs.filter((d) => (d.category || "other").toLowerCase() === cat);
              if (items.length > 0) acc[cat] = items;
              return acc;
            }, {});
            const uncategorized = uploadedDocs.filter((d) => !categoryOrder.includes((d.category || "other").toLowerCase()));
            if (uncategorized.length > 0) {
              groupedUploads.other = [...(groupedUploads.other || []), ...uncategorized];
            }

            return (
              <div className="space-y-5 screen-fade">
                {/* Critical Value Alert Banner */}
                {criticalFlags.length > 0 && (
                  <div className="p-4 rounded-2xl bg-rose-50 border-2 border-rose-300 text-rose-950 shadow-sm space-y-1.5">
                    <div className="flex items-center gap-2 font-black text-xs uppercase tracking-wider text-rose-800">
                      <span>🚨</span>
                      <span>Critical Diagnostic Alert ({criticalFlags.length} Flagged)</span>
                    </div>
                    <ul className="list-disc list-inside text-xs space-y-0.5 font-semibold text-rose-900">
                      {criticalFlags.map((flag, i) => (
                        <li key={i}>{flag}</li>
                      ))}
                    </ul>
                  </div>
                )}

                {/* Inline PDF Error Banner */}
                {diagPdfError && (
                  <div className="p-3.5 rounded-xl bg-rose-50 border border-rose-300 text-rose-800 text-xs font-semibold flex items-center justify-between">

                    <button type="button" onClick={() => setDiagPdfError("")} className="text-rose-600 hover:text-rose-900 font-bold ml-3">✕</button>
                  </div>
                )}

                {/* 1. RADIOLOGY / X-RAY CARD */}
